<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 2</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #fde5eb;
            color: #172033;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #6d666d;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        button {
            padding: 11px 18px;
            border: 1px solid #111;
            border-radius: 22px;
            background: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #111;
            color: #fff;
        }

     
        .note {
            padding: 16px 18px;
            background: #fff4c8;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        kbd {
            padding: 2px 6px;
            border: 1px solid #999;
            border-radius: 5px;
            background: #fff;
            font-family: Consolas, "Courier New", monospace;
        }

        code {
            font-family: Consolas, "Courier New", monospace;
        }
    </style>
</head>
<body>
    <div class="wrap">

        <h1>Part 2 - Introduction to JavaScript</h1>

            <button onclick="run(9)">Task 9 - Strings</button>

            <button onclick="run(12)">Task 12 - Functions</button>
        </div>

    </div>

</body>
</html>
